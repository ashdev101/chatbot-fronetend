<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="chat-icon">
  <defs>
    <linearGradient id="head-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="body-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Bot head -->
  <circle cx="50" cy="45" r="28" fill="url(#head-gradient)" stroke="#dbeafe" stroke-width="2.5"/>
  
  <!-- Antenna -->
  <line x1="50" y1="17" x2="50" y2="10" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="8" r="4" fill="#fbbf24">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Eyes -->
  <circle cx="42" cy="42" r="4.5" fill="#1e293b"/>
  <circle cx="40.5" cy="40.5" r="2" fill="#ffffff"/>
  <circle cx="58" cy="42" r="4.5" fill="#1e293b"/>
  <circle cx="56.5" cy="40.5" r="2" fill="#ffffff"/>
  
  <!-- Happy smile -->
  <path d="M 38 52 Q 50 60 62 52" stroke="#1e293b" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Cheeks -->
  <circle cx="34" cy="50" r="3" fill="#f472b6" opacity="0.5"/>
  <circle cx="66" cy="50" r="3" fill="#f472b6" opacity="0.5"/>
  
  <!-- Body/Base -->
  <rect x="38" y="70" width="24" height="18" rx="4" fill="url(#body-gradient)" stroke="#e9d5ff" stroke-width="2.5"/>
  
  <!-- Body detail -->
  <circle cx="50" cy="79" r="2.5" fill="#c084fc"/>
  
  <!-- Arms -->
  <line x1="35" y1="75" x2="25" y2="75" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  <line x1="65" y1="75" x2="75" y2="75" stroke="#8b5cf6" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Connection line body to head -->
  <line x1="50" y1="73" x2="50" y2="70" stroke="#94a3b8" stroke-width="3"/>
</svg>
